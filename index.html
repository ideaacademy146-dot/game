<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>یاری مەتەڵ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e3b2c; --bg2:#0a2c21; --paper:#fffdf6; --ink:#14221b;
  --red:#d6282f; --gold:#f5b81c; --green:#1f7a4f; --muted:#5d6f66;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--paper);
  background:radial-gradient(circle at 50% -10%,#1b5c43 0,var(--bg) 45%,var(--bg2) 100%);
  font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,serif;
}
main{max-width:980px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:26px}
.sun{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;
  background:repeating-conic-gradient(var(--gold) 0 7.5deg,transparent 7.5deg 15deg);
  position:relative}
.sun::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--bg)}
h1{font-family:"Noto Kufi Arabic","Segoe UI",sans-serif;font-weight:800;font-size:clamp(28px,6vw,44px);margin:0 0 6px}
.sub{margin:0;color:#cfe3d8;font-size:18px}
.score{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:6px 18px;border-radius:999px;
  background:rgba(255,255,255,.1);font-family:"Noto Kufi Arabic",sans-serif;font-size:15px}
.score b{color:var(--gold);font-size:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;perspective:1200px}
.card{position:relative;min-height:190px;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit;
  transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.card.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;overflow:auto}
.front{background:var(--paper);color:var(--ink);box-shadow:0 8px 0 var(--red),0 14px 24px rgba(0,0,0,.35);
  border:3px solid var(--gold)}
.front span{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--red)}
.front small{margin-top:8px;color:var(--muted);font-size:15px}
.card:hover:not(.open) .front{transform:translateY(-4px)}
.card.done .front{background:#dcebe2;border-color:var(--green);box-shadow:0 8px 0 var(--green),0 14px 24px rgba(0,0,0,.35)}
.card.done .front span{color:var(--green)}
.back{transform:rotateY(180deg);background:var(--green);color:#fff;border:3px solid var(--gold);
  box-shadow:0 14px 24px rgba(0,0,0,.35);text-align:center;gap:10px}
.q{font-size:18px;line-height:1.7;font-weight:700;margin:0}
.ans{display:none;margin:0;padding:6px 14px;border-radius:10px;background:var(--gold);color:var(--ink);font-weight:700;font-size:20px}
.card.shown .ans{display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:15px;padding:5px 14px;border-radius:999px;border:2px solid var(--gold);
  background:transparent;color:#fff;cursor:pointer}
.btn.main{background:var(--gold);color:var(--ink);font-weight:700}
.card.shown .btn.main{display:none}
.card:focus-visible,.btn:focus-visible,.reset:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.reset{display:block;margin:30px auto 0;font:inherit;font-size:17px;padding:8px 26px;border-radius:999px;
  border:2px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
.reset:hover{background:var(--gold);color:var(--ink)}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.card{min-height:210px}.q{font-size:17px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="sun" aria-hidden="true"></div>
    <h1>یاری مەتەڵ</h1>
    <p class="sub">ژمارەیەک هەڵبژێرە و پرسیارەکەی بخوێنەرەوە</p>
    <div class="score">وەڵامی بینراو: <b id="count">٠</b> / ١٥</div>
  </header>
  <section class="grid" id="grid" aria-label="خشتەی پرسیارەکان"></section>
  <button class="reset" id="reset">دەستپێکردنەوە</button>
</main>

<script>
const data=[
["ئەو شتە چییە کە هەرچەندە زیاتر لێی ببەیتەوە، گەورەتر دەبێت؟","چاڵ"],
["پایتەختی هەرێمی کوردستان کام شارە؟","هەولێر"],
["چی چوار پێی هەیە بەڵام ناڕوات؟","مێز"],
["بەرزترین لوتکەی چیای هەرێمی کوردستان چییە؟","هەڵگورد"],
["ئەو شتە چییە کە بێ پێ دەڕوات و هەرگیز ناوەستێت؟","کات"],
["ئاڵای کوردستان چەند ڕەنگی هەیە؟","چوار ڕەنگ: سوور، سپی، سەوز و زەرد"],
["چی دەچێتە ناو ئاوەوە بەڵام تەڕ نابێت؟","سێبەر"],
["گەورەترین ئاژەڵی وشکانی کامەیە؟","فیل"],
["حەوت جار هەشت چەندە؟","٥٦"],
["ناوی یەکێک لە ڕووبارە گەورەکانی کوردستان بڵێ.","زێی گەورە، زێی بچووک یان سیروان"],
["چی دەمی هەیە بەڵام قسە ناکات؟","ڕووبار"],
["هەفتەیەک چەند ڕۆژی تێدایە؟","حەوت ڕۆژ"],
["ئەو شتە چییە کە هەمیشە بەرەو سەرەوە دەچێت و هەرگیز نایەتە خوارەوە؟","تەمەن"],
["ئاو لە چەند پلەی سەدیدا دەکوڵێت؟","١٠٠ پلە"],
["کام هەسارە نزیکترینە لە خۆرەوە؟","عوتارد"]
];
const toK=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const grid=document.getElementById("grid"),count=document.getElementById("count");
const seen=new Set();
data.forEach(([q,a],i)=>{
  const c=document.createElement("div");
  c.className="card";c.tabIndex=0;c.setAttribute("role","button");
  c.setAttribute("aria-label","پرسیاری "+toK(i+1));
  c.innerHTML=`<div class="face front"><span>${toK(i+1)}</span><small>کلیک بکە</small></div>
  <div class="face back"><p class="q">${q}</p><p class="ans">${a}</p>
  <div class="actions"><button class="btn main" type="button">وەڵام ببینە</button><button class="btn close" type="button">داخستن</button></div></div>`;
  const open=()=>{if(!c.classList.contains("open"))c.classList.add("open")};
  c.addEventListener("click",e=>{
    if(e.target.closest(".main")){c.classList.add("shown");seen.add(i);c.classList.add("done");count.textContent=toK(seen.size);return}
    if(e.target.closest(".close")){c.classList.remove("open");return}
    open();
  });
  c.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target===c){e.preventDefault();open()}});
  grid.appendChild(c);
});
document.getElementById("reset").onclick=()=>{
  seen.clear();count.textContent="٠";
  document.querySelectorAll(".card").forEach(c=>c.classList.remove("open","shown","done"));
};
</script>
</body>
</html>
